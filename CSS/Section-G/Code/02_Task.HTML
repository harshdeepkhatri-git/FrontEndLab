<!DOCTYPE html>
<html lang="en">
<head>
 <!-- 2. Create a quote box with a dotted border.    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Box</title>
    <style>
        .quote{
            border: dotted;
            bottom: 3px dotted black;
            padding: 20px;
            text-align: center;
        }

    </style>
</head>
<body>
    <div class="quote">
        <p>Beleive in yourself and keep going</p>
        <p>_____Unknown</p>
    </div>
    
</body>
</html>
