<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warning Box</title>
    <style>
        .warning{
            border: 3px dashed red;
            padding: 20px;
            background-color: lightyellow;
            width: fit-content;
        }
    </style>
</head>
<body>
    <div class="warning">
        <h3>⚠️ Warning!</h3>
        <p>Please check your input before submitting.</p>
    </div>
</body>
</html>
