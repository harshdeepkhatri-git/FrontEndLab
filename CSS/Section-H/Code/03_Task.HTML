<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rounded Top Card</title>
    <style>
        .card{
            width: 300px;
            padding: 20px;
            border: 2px solid black;
            background-color: lightblue;
            border-radius: 20px 20px 0 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Mountain View</h2>
        <p>This is a simple card with only top corner rounded</p>
    </div>
</body>
</html>
