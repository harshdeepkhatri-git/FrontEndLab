<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Different border radius</title>
    <style>
        .box{
            width: 300px;
            height: 150px;
            background-color: lightblue;
            border: 3px solid black;
            border-radius: 10px 20px 30px 40px;
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
