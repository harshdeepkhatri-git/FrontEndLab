<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html {
            font-size: 16px;
        }

        .parent {
            font-size: 20px;
        }

        .using-em {
            font-size: 2em;
        }

        .using-rem {
            font-size: 2rem;
        }
    </style>
</head>

<body>
    <div class="parent">
        <p class="using-em">Text using em</p>
        <p class="using-rem">Text using rem</p>
    </div>
</body>

</html>
