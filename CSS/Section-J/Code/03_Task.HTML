<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Gap Practice</title>
</head>
<style>
    .container{
        display: flex;
        gap: 50px;
    }

    .card{
        width: 80px;
        height: 80px;
        background-color: lightblue;
        border: 2px solid black;
        text-align: center;
    }
</style>
<body>
    <div class="container">
         <div class="card">Card 1</div>
         <div class="card">Card 2</div>
         <div class="card">Card 3</div>
    </div>
    
</body>
</html>
