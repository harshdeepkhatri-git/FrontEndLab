<!-- External CSS
External CSS means writing CSS in a separate file(example:style.css).

The CSS file is linked to HTML using <link>.

Best for big projects and reusability.


-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External Css</title>

    <link rel="stylesheet" href="03_Style.CSS">
</head>

<body>
    <h1>Welcome to Css. </h1>

    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Ex, numquam iste laborum totam dolores velit possimus
        ut accusantium non aperiam suscipit corrupti rerum minus voluptate!</p>

        <div>Css Makes the web-pages beautiful</div>

</body>

</html>
