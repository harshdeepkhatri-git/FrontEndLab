<!-- 5. Font-Style

font-style changes text to italic or normal.

Syntax: 
            selector {
            font-style : italic;
            } -->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    text {
        font-style: italic;
    }

    p {
        font-weight: bold;
        font-style: italic;
    }

    h2 {
        font-style: normal;
    }
</style>

<body>


    <!-- 1. Make a sentence italic. -->
    <text>Sentence in italic</text>

    <!-- 3. Try bold + italic together. -->
    <p>Bold and italic both in same line</p>

    <!-- 2. Change italic element back to normal. -->
    <h2>Normal Text</h2>

</body>

</html>
