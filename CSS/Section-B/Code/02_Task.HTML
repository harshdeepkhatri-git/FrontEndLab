<!-- Font Family 
 font-family sets the font type.
 If the first font is missing, browser uses the next one. 




-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        p {
        font-family: Arial, sans-serif;
        }

code {
   font-family: "Courier New", monospace;
     }

body {
  font-family: Verdana, sans-serif;
}
    </style>
</head>

<!--
Practice
1.Apply Arial to all <p>tags.
2.Use "Courier New" for code text.
3.Apply Verdana with fallback sans-serif. 


-->

<body>
    <p>This paragraph uses Arial.</p>
  <p>Code uses <code>Courier New</code>.</p>
  <p>The page uses Verdana by default.</p>

</body>

</html>
