<!-- 4.Font-Weight
>> font-weight controls thickness.
>> Values: normal, bold, bolder, lighter, or numbers (100–900).

Syntax:
selector {
font-weight: bold ;
} -->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    h1{
        font-weight: lighter;
    }

    text{
        font-weight: 600;
    }

    p{
       font-weight: bold;
    }
</style>

<body>
    <!-- 1. Make a heading lighter. -->
    <h1>Heading lighter</h1>

      <!-- 2. Try font-weight: 600. -->
    <text> Font Weight 600</text>


     <!-- 3. Apply bold to a paragraph. -->
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Et vero porro voluptas adipisci magnam vitae error ut
        sequi quo! Temporibus atque tempore quos soluta aliquam?</p>


</body>

</html>
