<!-- Color 
 >> color sets the text color.
 >> You can use color names (red, blue), hex codes (#ff0000), or rgb()values.
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        p{
            color: blue
        }

        h1{
            color: #FFA500; 
        }
        
        h2{
          color: rgb(0,0,225);
        }

       
    </style>
</head>

<body>

    <!-- 1. Make a paragraph colo9r blue. -->
   <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ullam deleniti fuga aperiam sapiente laboriosam,
   quisquam doloribus maxime dolore mollitia vero nihil, autem, adipisci at doloremque.</p>

   <!-- 2. Use hex code to make a heading orange. -->
   <h1> Welcome to css</h1>

   <!-- 3.
      Try rgb(0,0,255) to make text blue. 
      -->

   <h2>Welcome to HTML</h2>

</body>

</html>
