<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>
<body>
    <fieldset>
        <legend>Feedback Form</legend>

        <p>
           <b>Full Name: </b>
           <input type="text">
           <br><br>

           <b>Email: </b>
           <input type="text">

           <p><b>Feedback Type: </b></p>
         <section>
            <label for="Good">Good</label>
            <input type="radio" name="Feedback Type" id="Good" value="Good" >

            <label for="Average">Average</label>
            <input type="radio" name="Feedback Type" id="Average" value="Average">

            <label for="Poor">Poor</label>
            <input type="radio" name="Feedback Type" id="Poor" value="Poor">
         </section>


         <p><b>Features Liked: </b></p>
            <section>
                <label for="Design">Design</label>
                <input type="checkbox" name="Features Liked" id="Design" value="Design">
                
                <label for="Speed">Speed</label>
                <input type="checkbox" name="Features Liked" id="Speed" value="Speed">

                <label for="Content">content</label>
                <input type="checkbox" name="Features Liked" id="Content" value="Content" >

                <label for="Usability">Usability</label>
                <input type="checkbox" name="Features Liked" id="Usability" value="Usability">
                <br>
            </section>

            <p><b>Comments: </b></p>
              <textarea rows="5" cols="50" placeholder="Type Comments..."></textarea>
              
        </p>
    </fieldset>
    
</body>
</html>
