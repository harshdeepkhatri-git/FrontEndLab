<!DOCTYPE html>
<html>
<head>
    <title>Course Enrollment Form</title>
</head>
<body>

<form>

    <label>Full Name:</label>
    <input type="text">
    <br><br>

    <label>Email:</label>
    <input type="email">
    <br><br>

    <label>Select Course:</label>
    <select>
        <option>HTML Basics</option>
        <option>CSS Basics</option>
        <option>JavaScript</option>
        <option>Java</option>
    </select>
    <br><br>

    <label>Select Timing:</label>
    <br>
    <input type="radio" name="timing"> Morning
    <input type="radio" name="timing"> Afternoon
    <input type="radio" name="timing"> Evening
    <br><br>

    <label>Additional Modules:</label>
    <br>
    <select multiple size="4">
        <option>Git & GitHub</option>
        <option>Node.js</option>
        <option>MongoDB</option>
        <option>Deployment</option>
    </select>
    <br><br>

    <label>Comments:</label>
    <br>
    <textarea rows="5" cols="40"></textarea>
    <br><br>

    <input type="submit" value="Enroll Now">

</form>

</body>
</html>
